<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت · دستیار اسناد</title>
<link rel="stylesheet" href="styles.css">
<style>
  .admin-main { padding-block: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
  .section-title { font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-3); display:flex; align-items:center; gap:var(--space-2); }
  .section-title svg { width: 20px; height: 20px; color: var(--primary); }
  .grant-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; }
  .grant-row .field { flex: 1; min-width: 160px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      پنل مدیریت
    </div>
    <div class="topbar-actions">
      <a href="/" class="btn btn-secondary btn-sm">بازگشت به برنامه</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">خروج</button>
    </div>
  </div>
</header>

<div class="container-wide admin-main" id="adminMain">

  <div class="stat-grid" id="stats"></div>

  <div class="card">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      اعطای دستی اشتراک
    </div>
    <div class="grant-row">
      <div class="field">
        <label class="field-label" for="grantPhone">شماره موبایل</label>
        <input class="input" type="tel" id="grantPhone" inputmode="numeric" placeholder="09xxxxxxxxx">
      </div>
      <div class="field">
        <label class="field-label" for="grantPlan">پلن</label>
        <select class="select" id="grantPlan"></select>
      </div>
      <button class="btn btn-primary" onclick="grantSubscription()">اعطا کن</button>
    </div>
    <div id="msg" style="margin-top:var(--space-3);"></div>
  </div>

  <div>
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      کاربران
    </div>
    <div class="table-wrap">
      <table class="data" id="usersTable">
        <thead><tr><th>شماره موبایل</th><th>تاریخ ثبت‌نام</th><th>اشتراک</th><th>انقضا</th><th>نقش</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div>
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      اشتراک‌ها
    </div>
    <div class="table-wrap">
      <table class="data" id="subsTable">
        <thead><tr><th>شماره</th><th>پلن</th><th>شروع</th><th>انقضا</th><th>وضعیت</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div>
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      پرداخت‌ها
    </div>
    <div class="table-wrap">
      <table class="data" id="paymentsTable">
        <thead><tr><th>شماره</th><th>پلن</th><th>مبلغ (تومان)</th><th>وضعیت</th><th>تاریخ</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const STATUS_BADGE = {
  active: '<span class="badge badge-success">فعال</span>',
  cancelled: '<span class="badge badge-muted">لغو شده</span>',
  paid: '<span class="badge badge-success">پرداخت شده</span>',
  pending: '<span class="badge badge-muted">در انتظار</span>',
  failed: '<span class="badge badge-danger">ناموفق</span>',
};
function statusBadge(s) { return STATUS_BADGE[s] || `<span class="badge badge-muted">${s}</span>`; }
function shortDate(s) { return (s || '-').slice(0, 10); }

async function loadAll() {
  const [statsRes, usersRes, subsRes, paymentsRes, plansRes] = await Promise.all([
    fetch('/api/admin/stats'), fetch('/api/admin/users'),
    fetch('/api/admin/subscriptions'), fetch('/api/admin/payments'), fetch('/api/plans')
  ]);

  if (statsRes.status === 403 || usersRes.status === 403) {
    document.getElementById('adminMain').innerHTML =
      '<div class="card text-center"><h2>دسترسی غیرمجاز</h2><p class="muted">برای مشاهده این صفحه باید با حساب مدیر وارد شوید.</p><a class="btn btn-primary" href="/login.html">ورود</a></div>';
    return;
  }

  const stats = await statsRes.json();
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-value">${stats.total_users.toLocaleString('fa-IR')}</div><div class="stat-label">کل کاربران</div></div>
    <div class="stat"><div class="stat-value">${stats.active_subscriptions.toLocaleString('fa-IR')}</div><div class="stat-label">اشتراک فعال</div></div>`;

  const plans = (await plansRes.json()).plans;
  document.getElementById('grantPlan').innerHTML =
    plans.map(p => `<option value="${p.id}">${p.name} — ${p.price_toman.toLocaleString('fa-IR')} تومان</option>`).join('');

  const users = (await usersRes.json()).users;
  document.querySelector('#usersTable tbody').innerHTML = users.map(u => `
    <tr>
      <td>${u.phone}</td>
      <td>${shortDate(u.created_at)}</td>
      <td>${u.has_subscription ? '<span class="badge badge-success">فعال</span>' : '<span class="badge badge-muted">ندارد</span>'}</td>
      <td>${shortDate(u.subscription_expires_at)}</td>
      <td>${u.is_admin ? '<span class="badge badge-primary">مدیر</span>' : '<span class="badge badge-muted">کاربر</span>'}</td>
    </tr>`).join('') || emptyRow(5);

  const subs = (await subsRes.json()).subscriptions;
  document.querySelector('#subsTable tbody').innerHTML = subs.map(s => `
    <tr>
      <td>${s.phone}</td>
      <td>${s.plan_name}</td>
      <td>${shortDate(s.starts_at)}</td>
      <td>${shortDate(s.expires_at)}</td>
      <td>${statusBadge(s.status)}</td>
      <td>${s.status === 'active' ? `<button class="btn btn-danger btn-sm" onclick="revoke(${s.id})">لغو</button>` : ''}</td>
    </tr>`).join('') || emptyRow(6);

  const pays = (await paymentsRes.json()).payments;
  document.querySelector('#paymentsTable tbody').innerHTML = pays.map(p => `
    <tr>
      <td>${p.phone}</td>
      <td>${p.plan_name}</td>
      <td>${p.amount_toman.toLocaleString('fa-IR')}</td>
      <td>${statusBadge(p.status)}</td>
      <td>${shortDate(p.created_at)}</td>
    </tr>`).join('') || emptyRow(5);
}

function emptyRow(cols) {
  return `<tr><td colspan="${cols}" class="text-center muted" style="padding:var(--space-8);">موردی وجود ندارد</td></tr>`;
}

function showMsg(text, type) {
  document.getElementById('msg').innerHTML = text ? `<div class="alert alert-${type}">${text}</div>` : '';
}

async function grantSubscription() {
  const phone = document.getElementById('grantPhone').value.trim();
  const plan_id = document.getElementById('grantPlan').value;
  showMsg('در حال اعطا...', 'info');
  const res = await fetch('/api/admin/grant', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone, plan_id })
  });
  const data = await res.json();
  if (res.ok) { showMsg('اشتراک با موفقیت اعطا شد.', 'success'); document.getElementById('grantPhone').value = ''; loadAll(); }
  else showMsg(data.error || 'خطا', 'danger');
}

async function revoke(subscriptionId) {
  if (!confirm('آیا از لغو این اشتراک مطمئن هستید؟')) return;
  await fetch('/api/admin/revoke', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ subscription_id: subscriptionId })
  });
  loadAll();
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

loadAll();
</script>

</body>
</html>
