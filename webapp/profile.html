<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پروفایل · دستیار اسناد</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="styles.css">
<style>
  body { background:
      radial-gradient(1200px 600px at 100% -10%, var(--glow-1) 0%, transparent 55%),
      radial-gradient(1000px 500px at 0% 0%, var(--glow-2) 0%, transparent 50%),
      var(--bg); }
  .topbar { background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(10px); }
  .page { max-width: 760px; margin-inline: auto; padding: var(--space-8) var(--space-4) var(--space-12); }
  .page-head { margin-bottom: var(--space-6); }
  .page-head h1 { font-size: var(--text-2xl); }
  .page-head p { color: var(--muted-foreground); margin-top: var(--space-1); }
  .card + .card { margin-top: var(--space-6); }
  .form-row { display: flex; gap: var(--space-3); }
  .form-row > div { flex: 1; }
  .field { margin-bottom: var(--space-4); }
  .dob-row { display: grid; grid-template-columns: 1.2fr 1.4fr 1fr; gap: var(--space-2); }
  .readonly-val { color: var(--muted-foreground); }
  .section-title { display: flex; align-items: center; gap: var(--space-2); font-weight: 700; font-size: var(--text-lg); margin-bottom: var(--space-1); }
  .section-sub { color: var(--muted-foreground); font-size: var(--text-sm); margin-bottom: var(--space-5); }
  .save-row { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2); }
  .empty { text-align: center; color: var(--muted-foreground); padding: var(--space-6); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand" style="text-decoration:none; color:inherit;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h3"/></svg>
      دستیار اسناد
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" data-theme-toggle onclick="toggleTheme()" title="حالت روشن/تاریک">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="/" class="btn btn-secondary btn-sm">بازگشت به داشبورد</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">خروج</button>
    </div>
  </div>
</header>

<div class="page">
  <div class="page-head">
    <h1>حساب کاربری</h1>
    <p>اطلاعات حساب خود را مشاهده و ویرایش کنید و سوابق پرداخت‌تان را ببینید.</p>
  </div>

  <!-- Account info -->
  <div class="card">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;color:var(--primary);"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      اطلاعات من
    </div>
    <p class="section-sub">شماره موبایل قابل ویرایش نیست؛ بقیه فیلدها را می‌توانید تغییر دهید.</p>

    <div class="form-row">
      <div class="field">
        <label class="field-label" for="firstName">نام</label>
        <input class="input" type="text" id="firstName">
      </div>
      <div class="field">
        <label class="field-label" for="lastName">نام خانوادگی</label>
        <input class="input" type="text" id="lastName">
      </div>
    </div>

    <div class="field">
      <label class="field-label">شماره موبایل</label>
      <input class="input" type="tel" id="phone" disabled>
    </div>

    <div class="field">
      <label class="field-label">تاریخ تولد (شمسی)</label>
      <div class="dob-row">
        <select class="select" id="dobYear"></select>
        <select class="select" id="dobMonth"></select>
        <select class="select" id="dobDay"></select>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="email">ایمیل</label>
      <input class="input" type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label class="field-label" for="password">تغییر رمز عبور <span class="muted" style="font-weight:400;">(اختیاری)</span></label>
      <input class="input" type="password" id="password" autocomplete="new-password" placeholder="برای تغییر، رمز جدید را وارد کنید">
    </div>

    <div class="save-row">
      <button class="btn btn-primary" id="saveBtn" onclick="saveProfile()">ذخیره تغییرات</button>
      <span id="msg"></span>
    </div>
  </div>

  <!-- Payment history -->
  <div class="card">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;color:var(--primary);"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      سوابق پرداخت
    </div>
    <p class="section-sub">تراکنش‌های خرید اشتراک شما.</p>
    <div id="payments"></div>
  </div>
</div>

<script src="jalali.js"></script>
<script>
const yearSel = document.getElementById('dobYear');
const monthSel = document.getElementById('dobMonth');
const daySel = document.getElementById('dobDay');
fillJalaliSelects(yearSel, monthSel, daySel);

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.innerHTML = text ? `<span class="badge badge-${type}">${text}</span>` : '';
}

const STATUS_MAP = {
  paid: { label: 'موفق', cls: 'badge-success' },
  pending: { label: 'در انتظار', cls: 'badge-muted' },
  failed: { label: 'ناموفق', cls: 'badge-danger' },
};

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

async function loadProfile() {
  const res = await fetch('/api/profile');
  if (res.status === 401) { window.location.href = '/login.html'; return; }
  const data = await res.json();
  document.getElementById('firstName').value = data.first_name || '';
  document.getElementById('lastName').value = data.last_name || '';
  document.getElementById('phone').value = data.phone || '';
  document.getElementById('email').value = data.email || '';
  isoToJalaliSelects(data.birth_date, yearSel, monthSel, daySel);
}

async function loadPayments() {
  const res = await fetch('/api/profile/payments');
  const data = await res.json();
  const rows = data.payments || [];
  const box = document.getElementById('payments');
  if (!rows.length) {
    box.innerHTML = '<div class="empty">هنوز پرداختی ثبت نشده است.</div>';
    return;
  }
  box.innerHTML = `<div class="table-wrap"><table class="data">
    <thead><tr><th>پلن</th><th>مبلغ (تومان)</th><th>وضعیت</th><th>تاریخ</th></tr></thead>
    <tbody>${rows.map(p => {
      const st = STATUS_MAP[p.status] || { label: p.status, cls: 'badge-muted' };
      return `<tr>
        <td>${escapeHtml(p.plan_name || '')}</td>
        <td>${Number(p.amount_toman).toLocaleString('fa-IR')}</td>
        <td><span class="badge ${st.cls}">${st.label}</span></td>
        <td>${formatJalali(p.created_at)}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}

async function saveProfile() {
  const password = document.getElementById('password').value;
  if (password && password.length < 6) { showMsg('رمز عبور حداقل ۶ کاراکتر', 'danger'); return; }

  const birthDate = jalaliSelectsToISO(yearSel, monthSel, daySel);
  if (birthDate === null) { showMsg('تاریخ تولد را کامل کنید', 'danger'); return; }
  if (birthDate === undefined) { showMsg('تاریخ تولد نامعتبر است', 'danger'); return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner"></span> در حال ذخیره';
  showMsg('');
  try {
    const res = await fetch('/api/profile', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        first_name: document.getElementById('firstName').value.trim(),
        last_name: document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        birth_date: birthDate,
        password: password || undefined,
      })
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('password').value = '';
      showMsg('ذخیره شد', 'success');
    } else {
      showMsg(data.error || 'خطا', 'danger');
    }
  } catch (e) {
    showMsg('خطا در ارتباط با سرور', 'danger');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'ذخیره تغییرات';
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

loadProfile();
loadPayments();
</script>
<script src="theme.js"></script>

</body>
</html>
