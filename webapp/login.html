<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود · دستیار اسناد</title>
<link rel="stylesheet" href="styles.css">
<style>
  .auth-wrap {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4);
  }
  .auth-card { width: 100%; max-width: 400px; }
  .auth-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-6);
  }
  .auth-brand .logo {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    background: var(--primary-soft); color: var(--primary);
    border-radius: var(--radius);
  }
  .auth-brand .logo svg { width: 28px; height: 28px; }
  .auth-brand h1 { font-size: var(--text-xl); }
  .step-hint { font-size: var(--text-sm); color: var(--muted-foreground); margin-bottom: var(--space-5); text-align: center; }
  .resend { text-align: center; margin-top: var(--space-4); font-size: var(--text-sm); }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h3"/></svg>
      </div>
      <h1>دستیار اسناد</h1>
    </div>

    <div class="card">
      <div id="step-phone">
        <h2 style="font-size:var(--text-lg); margin-bottom:var(--space-2);">ورود با شماره موبایل</h2>
        <p class="step-hint">شماره موبایل خود را وارد کنید تا کد تأیید برایتان ارسال شود.</p>
        <label class="field-label" for="phone">شماره موبایل</label>
        <input class="input" type="tel" id="phone" inputmode="numeric" placeholder="09xxxxxxxxx" autocomplete="tel" style="margin-bottom:var(--space-4);">
        <button class="btn btn-primary btn-block" id="phoneBtn" onclick="requestOtp()">دریافت کد تأیید</button>
      </div>

      <div id="step-code" style="display:none;">
        <h2 style="font-size:var(--text-lg); margin-bottom:var(--space-2);">کد تأیید</h2>
        <p class="step-hint">کد ارسال‌شده به <span id="phoneEcho" style="font-weight:600; color:var(--foreground);"></span> را وارد کنید.</p>
        <label class="field-label" for="code">کد ۶ رقمی</label>
        <input class="input" type="text" id="code" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="one-time-code" style="margin-bottom:var(--space-4); letter-spacing:6px; text-align:center; font-size:var(--text-xl); font-weight:600;">
        <button class="btn btn-primary btn-block" id="codeBtn" onclick="verifyOtp()">ورود</button>
        <div class="resend">
          <a href="#" onclick="backToPhone(event)">تغییر شماره</a>
        </div>
      </div>

      <div id="msg" style="margin-top:var(--space-4);"></div>
    </div>
  </div>
</div>

<script>
let phoneValue = "";

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  if (!text) { msg.innerHTML = ''; return; }
  msg.innerHTML = `<div class="alert alert-${type}">${text}</div>`;
}

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span> لطفاً صبر کنید' : label;
}

function backToPhone(e) {
  e.preventDefault();
  document.getElementById('step-code').style.display = 'none';
  document.getElementById('step-phone').style.display = 'block';
  showMsg('');
}

async function requestOtp() {
  const phone = document.getElementById('phone').value.trim();
  showMsg('');
  setLoading('phoneBtn', true);
  try {
    const res = await fetch('/api/auth/request-otp', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone })
    });
    const data = await res.json();
    if (res.ok) {
      phoneValue = phone;
      document.getElementById('phoneEcho').textContent = phone;
      document.getElementById('step-phone').style.display = 'none';
      document.getElementById('step-code').style.display = 'block';
      document.getElementById('code').focus();
      showMsg('کد تأیید ارسال شد.', 'success');
    } else {
      showMsg(data.error || 'خطا در ارسال کد', 'danger');
    }
  } catch (e) {
    showMsg('خطا در ارتباط با سرور.', 'danger');
  } finally {
    setLoading('phoneBtn', false, 'دریافت کد تأیید');
  }
}

async function verifyOtp() {
  const code = document.getElementById('code').value.trim();
  showMsg('');
  setLoading('codeBtn', true);
  try {
    const res = await fetch('/api/auth/verify-otp', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phoneValue, code })
    });
    const data = await res.json();
    if (res.ok) {
      window.location.href = data.is_admin ? '/admin.html' : '/';
    } else {
      showMsg(data.error || 'کد نامعتبر است', 'danger');
      setLoading('codeBtn', false, 'ورود');
    }
  } catch (e) {
    showMsg('خطا در ارتباط با سرور.', 'danger');
    setLoading('codeBtn', false, 'ورود');
  }
}

document.getElementById('phone').addEventListener('keydown', e => { if (e.key === 'Enter') requestOtp(); });
document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') verifyOtp(); });
</script>

</body>
</html>
