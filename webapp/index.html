<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار اسناد</title>
<link rel="stylesheet" href="styles.css">
<style>
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: var(--space-6); align-items: start; padding-block: var(--space-6); }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .sidebar { display: flex; flex-direction: column; gap: var(--space-4); position: sticky; top: 76px; }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: var(--space-5);
    text-align: center;
    cursor: pointer;
    transition: border-color var(--transition), background var(--transition);
  }
  .dropzone:hover { border-color: var(--primary); background: var(--primary-soft); }
  .dropzone svg { width: 28px; height: 28px; color: var(--muted-foreground); margin-bottom: var(--space-2); }
  .dropzone .hint { font-size: var(--text-sm); color: var(--muted-foreground); }
  .dropzone .formats { font-size: var(--text-xs); color: var(--muted-foreground); margin-top: var(--space-1); }

  .doc-list { display: flex; flex-direction: column; gap: var(--space-1); margin-top: var(--space-3); }
  .doc-item {
    display: flex; align-items: center; gap: var(--space-2);
    font-size: var(--text-sm); padding: 8px 10px; border-radius: var(--radius-sm);
    color: var(--foreground);
  }
  .doc-item svg { width: 16px; height: 16px; color: var(--muted-foreground); flex-shrink: 0; }
  .doc-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Chat */
  .chat { display: flex; flex-direction: column; min-height: calc(100dvh - 180px); }
  .messages { flex: 1; display: flex; flex-direction: column; gap: var(--space-4); padding-bottom: var(--space-4); }
  .empty-chat { text-align: center; color: var(--muted-foreground); padding: var(--space-12) var(--space-4); }
  .empty-chat svg { width: 44px; height: 44px; margin-bottom: var(--space-3); color: var(--border); }

  .msg { max-width: 92%; }
  .msg-user { align-self: flex-start; background: var(--primary); color: var(--on-primary); padding: 11px 16px; border-radius: var(--radius) var(--radius) var(--radius) 4px; }
  .msg-bot { align-self: flex-end; width: 100%; }
  .msg-bot .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 4px var(--radius); padding: var(--space-4) var(--space-5); box-shadow: var(--shadow-sm); white-space: pre-wrap; }

  .composer { position: sticky; bottom: 0; background: var(--bg); padding-top: var(--space-3); }
  .composer-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: var(--space-3); }
  .composer-row { display: flex; gap: var(--space-2); align-items: flex-end; }
  .composer textarea { border: none; box-shadow: none; padding: 8px; min-height: 44px; max-height: 160px; }
  .composer textarea:focus { box-shadow: none; }
  .composer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--border); flex-wrap: wrap; }
  .send-btn { width: 44px; height: 44px; padding: 0; border-radius: var(--radius-sm); flex-shrink: 0; }
  .send-btn svg { width: 18px; height: 18px; }

  .subscribe-hero { max-width: 460px; margin: var(--space-12) auto; text-align: center; }
  .subscribe-hero .icon { width: 56px; height: 56px; margin: 0 auto var(--space-4); display:flex; align-items:center; justify-content:center; background: var(--warning-soft); color: var(--warning); border-radius: var(--radius); }
  .plan-card { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4) var(--space-5); margin-top: var(--space-3); text-align: right; }
  .plan-price { font-size: var(--text-xl); font-weight: 700; }
  .plan-price small { font-size: var(--text-sm); font-weight: 400; color: var(--muted-foreground); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h3"/></svg>
      دستیار اسناد
    </div>
    <div class="topbar-actions">
      <span class="user-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="userInfo"></span>
      </span>
      <a href="/admin.html" class="btn btn-secondary btn-sm" id="adminLink" style="display:none;">پنل ادمین</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">خروج</button>
    </div>
  </div>
</header>

<!-- Subscribe gate -->
<div class="container" id="subscribeBox" style="display:none;">
  <div class="subscribe-hero">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>برای استفاده، اشتراک تهیه کنید</h1>
    <p class="muted">با تهیه اشتراک می‌توانید اسناد خود را بارگذاری کرده و از آن‌ها سؤال بپرسید.</p>
    <div id="plansList"></div>
  </div>
</div>

<!-- Main app -->
<div class="container-wide" id="appContent" style="display:none;">
  <div class="layout">
    <aside class="sidebar">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          بارگذاری سند
        </div>
        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <div class="hint">برای انتخاب فایل کلیک کنید</div>
          <div class="formats">TXT · PDF · DOCX</div>
        </div>
        <input type="file" id="fileInput" accept=".txt,.pdf,.docx" style="display:none;" onchange="uploadFile()">
        <div id="status" class="text-sm" style="margin-top:var(--space-3);"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          اسناد من
        </div>
        <div class="segmented" style="width:100%; display:flex; margin-bottom:var(--space-3);">
          <label style="flex:1; text-align:center; padding:0;"><input type="radio" name="scope" value="all" checked><span style="display:block;">همه</span></label>
          <label style="flex:1; text-align:center; padding:0;"><input type="radio" name="scope" value="selected"><span style="display:block;">یک سند</span></label>
        </div>
        <select class="select" id="docSelect" disabled></select>
        <div class="doc-list" id="docList"></div>
      </div>
    </aside>

    <main class="chat">
      <div class="messages" id="messages">
        <div class="empty-chat" id="emptyChat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <h3 style="font-weight:600;">سؤال خود را بپرسید</h3>
          <p class="text-sm">یک سند بارگذاری کنید و درباره محتوای آن سؤال بپرسید.</p>
        </div>
      </div>

      <div class="composer">
        <div class="composer-card">
          <div class="composer-row">
            <textarea class="textarea" id="question" rows="1" placeholder="سؤال خود را بنویسید..."></textarea>
            <button class="btn btn-primary send-btn" id="askBtn" onclick="askQuestion()" title="ارسال">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
const docSelect = document.getElementById('docSelect');
const messages = document.getElementById('messages');
const questionEl = document.getElementById('question');

function getScope() { return document.querySelector('input[name="scope"]:checked').value; }

document.querySelectorAll('input[name="scope"]').forEach(r => {
  r.addEventListener('change', () => { docSelect.disabled = getScope() !== 'selected'; });
});

questionEl.addEventListener('input', () => {
  questionEl.style.height = 'auto';
  questionEl.style.height = Math.min(questionEl.scrollHeight, 160) + 'px';
});
questionEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askQuestion(); }
});

const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

async function checkAuth() {
  const res = await fetch('/api/auth/me');
  const data = await res.json();
  if (!data.logged_in) { window.location.href = '/login.html'; return false; }
  document.getElementById('userInfo').textContent = data.phone;
  if (data.is_admin) document.getElementById('adminLink').style.display = 'inline-flex';

  if (data.has_subscription) {
    document.getElementById('appContent').style.display = 'block';
    return true;
  } else {
    document.getElementById('subscribeBox').style.display = 'block';
    await loadPlans();
    return false;
  }
}

async function loadPlans() {
  const res = await fetch('/api/plans');
  const data = await res.json();
  document.getElementById('plansList').innerHTML = (data.plans || []).map(p => `
    <div class="plan-card">
      <div>
        <div style="font-weight:600;">${p.name}</div>
        <div class="text-sm muted">${p.duration_days} روز دسترسی کامل</div>
      </div>
      <div style="display:flex; align-items:center; gap:var(--space-4);">
        <div class="plan-price">${p.price_toman.toLocaleString('fa-IR')} <small>تومان</small></div>
        <button class="btn btn-primary" onclick="subscribe(${p.id}, this)">خرید</button>
      </div>
    </div>`).join('');
}

async function subscribe(planId, btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  const res = await fetch('/api/subscribe', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ plan_id: planId })
  });
  const data = await res.json();
  if (res.ok && data.redirect_url) {
    window.location.href = data.redirect_url;
  } else {
    alert(data.error || 'خطا در شروع پرداخت');
    btn.disabled = false;
    btn.textContent = 'خرید';
  }
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

async function refreshDocuments(selectId) {
  try {
    const res = await fetch('/api/documents');
    const data = await res.json();
    const docs = data.documents || [];
    docSelect.innerHTML = docs.map(d => `<option value="${d.document_id}">${d.source}</option>`).join('');
    if (selectId) docSelect.value = selectId;
    document.getElementById('docList').innerHTML = docs.length
      ? docs.map(d => `<div class="doc-item">${ICON_DOC}<span>${d.source}</span></div>`).join('')
      : '<div class="text-sm muted" style="padding:8px 10px;">هنوز سندی بارگذاری نشده.</div>';
  } catch (e) {}
}

async function uploadFile() {
  const input = document.getElementById('fileInput');
  const status = document.getElementById('status');
  if (!input.files.length) return;
  const formData = new FormData();
  formData.append('file', input.files[0]);
  status.innerHTML = '<span class="spinner"></span> در حال پردازش...';
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (res.ok) {
      status.innerHTML = `<span class="badge badge-success">آماده شد</span> «${data.filename}» با ${data.chunks.toLocaleString('fa-IR')} بخش اضافه شد.`;
      await refreshDocuments(data.document_id);
    } else {
      status.innerHTML = `<span class="alert alert-danger" style="display:block;">${data.error}</span>`;
    }
  } catch (e) {
    status.innerHTML = `<span class="alert alert-danger" style="display:block;">خطا در ارتباط با سرور.</span>`;
  }
  input.value = '';
}

function addMessage(role, html) {
  document.getElementById('emptyChat')?.remove();
  const wrap = document.createElement('div');
  if (role === 'user') {
    wrap.className = 'msg msg-user';
    wrap.textContent = html;
  } else {
    wrap.className = 'msg msg-bot';
    wrap.innerHTML = `<div class="bubble">${html}</div>`;
  }
  messages.appendChild(wrap);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return wrap;
}

async function askQuestion() {
  const question = questionEl.value.trim();
  const askBtn = document.getElementById('askBtn');
  const scope = getScope();
  const documentId = docSelect.value;
  const documentName = docSelect.selectedOptions[0]?.textContent || null;

  if (!question) return;
  if (scope === 'selected' && !documentId) {
    addMessage('bot', 'ابتدا یک سند را از فهرست انتخاب کنید.');
    return;
  }

  addMessage('user', question);
  questionEl.value = '';
  questionEl.style.height = 'auto';
  askBtn.disabled = true;
  const thinking = addMessage('bot', '<span class="spinner"></span> در حال فکر کردن...');

  try {
    const res = await fetch('/api/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, scope, document_id: documentId, document_name: documentName })
    });
    const data = await res.json();
    if (res.ok) {
      let html = escapeHtml(data.answer);
      if (data.sources && data.sources.length) {
        html += `<div class="sources"><strong>منابع</strong><ul>${data.sources.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul></div>`;
      }
      thinking.querySelector('.bubble').innerHTML = html;
    } else {
      thinking.querySelector('.bubble').innerHTML = `<span style="color:var(--destructive)">${escapeHtml(data.error || 'خطا')}</span>`;
    }
  } catch (e) {
    thinking.querySelector('.bubble').innerHTML = '<span style="color:var(--destructive)">خطا در ارتباط با سرور.</span>';
  } finally {
    askBtn.disabled = false;
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

const params = new URLSearchParams(window.location.search);
if (params.get('payment') === 'success') alert('پرداخت با موفقیت انجام شد! اشتراک شما فعال است.');
if (params.get('payment') === 'failed') alert('پرداخت ناموفق بود. در صورت کسر وجه، مبلغ بازگردانده می‌شود.');

checkAuth().then(ok => { if (ok) refreshDocuments(); });
</script>

</body>
</html>
