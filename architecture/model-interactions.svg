<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#243044" />
    </marker>
    <marker id="dashArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px "Segoe UI", Tahoma, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Tahoma, sans-serif; fill: #4b5563; }
      .lane { fill: #ffffff; stroke: #d8dee9; stroke-width: 1.5; rx: 18; }
      .laneTitle { font: 700 17px "Segoe UI", Tahoma, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #8996aa; stroke-width: 1.4; rx: 12; }
      .boxBlue { fill: #eaf3ff; stroke: #4f83cc; }
      .boxGreen { fill: #eaf8ef; stroke: #48a868; }
      .boxOrange { fill: #fff4e6; stroke: #d97706; }
      .boxPurple { fill: #f2ecff; stroke: #7c3aed; }
      .boxRed { fill: #fff1f2; stroke: #e11d48; }
      .db { fill: #eef2f7; stroke: #64748b; stroke-width: 1.5; }
      .text { font: 600 15px "Segoe UI", Tahoma, sans-serif; fill: #111827; }
      .small { font: 400 12.5px "Segoe UI", Tahoma, sans-serif; fill: #374151; }
      .tiny { font: 400 11px "Segoe UI", Tahoma, sans-serif; fill: #4b5563; }
      .line { fill: none; stroke: #243044; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#dashArrow); }
      .label { font: 600 12px "Segoe UI", Tahoma, sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1020" />
  <text class="title" x="750" y="52" text-anchor="middle">RAG System - Model Interaction Graph</text>
  <text class="subtitle" x="750" y="80" text-anchor="middle">Backend code orchestrates the models; the models do not directly call each other.</text>

  <!-- Lanes -->
  <rect class="lane" x="40" y="120" width="1420" height="155" />
  <text class="laneTitle" x="65" y="150">Request entry</text>

  <rect class="lane" x="40" y="305" width="900" height="360" />
  <text class="laneTitle" x="65" y="335">Grounded RAG path</text>

  <rect class="lane" x="980" y="305" width="480" height="360" />
  <text class="laneTitle" x="1005" y="335">Chat model gateway</text>

  <rect class="lane" x="40" y="700" width="1420" height="245" />
  <text class="laneTitle" x="65" y="730">Document ingestion and indexing</text>

  <!-- Top request path -->
  <rect class="box boxBlue" x="80" y="170" width="145" height="64" />
  <text class="text" x="152" y="196" text-anchor="middle">User</text>
  <text class="small" x="152" y="216" text-anchor="middle">question + selected docs</text>

  <rect class="box boxBlue" x="285" y="170" width="175" height="64" />
  <text class="text" x="372" y="196" text-anchor="middle">Next.js UI</text>
  <text class="small" x="372" y="216" text-anchor="middle">ChatApp / Composer</text>

  <rect class="box boxBlue" x="520" y="170" width="180" height="64" />
  <text class="text" x="610" y="196" text-anchor="middle">Next API proxy</text>
  <text class="small" x="610" y="216" text-anchor="middle">/api/ask/stream</text>

  <rect class="box boxBlue" x="760" y="170" width="190" height="64" />
  <text class="text" x="855" y="196" text-anchor="middle">FastAPI ask.py</text>
  <text class="small" x="855" y="216" text-anchor="middle">prepare mode + persist</text>

  <polygon class="box boxOrange" points="1040,170 1125,202 1040,234 955,202" />
  <text class="text" x="1040" y="198" text-anchor="middle">mode?</text>
  <text class="tiny" x="1040" y="216" text-anchor="middle">free / RAG / tool</text>

  <path class="line" d="M225 202 H285" />
  <path class="line" d="M460 202 H520" />
  <path class="line" d="M700 202 H760" />
  <path class="line" d="M950 202 H955" />

  <path class="line" d="M1040 234 V290 H520 V352" />
  <text class="label" x="545" y="292">grounded_chat</text>
  <path class="line" d="M1125 202 H1195 V352" />
  <text class="label" x="1210" y="292">provider selected once</text>
  <path class="line" d="M1040 170 V118 H1220 V352" />
  <text class="label" x="1235" y="145">free_chat uses ChatProvider directly</text>

  <!-- RAG path -->
  <rect class="box boxPurple" x="80" y="370" width="170" height="70" />
  <text class="text" x="165" y="396" text-anchor="middle">understand_query</text>
  <text class="small" x="165" y="416" text-anchor="middle">LLM JSON search query</text>

  <rect class="box boxGreen" x="305" y="370" width="155" height="70" />
  <text class="text" x="382" y="396" text-anchor="middle">bge-m3</text>
  <text class="small" x="382" y="416" text-anchor="middle">embed query</text>

  <path class="db" d="M525 370 h170 a18 18 0 0 1 18 18 v34 a18 18 0 0 1 -18 18 h-170 a18 18 0 0 1 -18 -18 v-34 a18 18 0 0 1 18 -18 z" />
  <text class="text" x="610" y="396" text-anchor="middle">pgvector</text>
  <text class="small" x="610" y="416" text-anchor="middle">dense search over chunks</text>

  <rect class="box boxGreen" x="760" y="370" width="145" height="70" />
  <text class="text" x="832" y="396" text-anchor="middle">reranker</text>
  <text class="small" x="832" y="416" text-anchor="middle">bge-reranker-v2-m3</text>

  <rect class="box boxPurple" x="190" y="525" width="210" height="70" />
  <text class="text" x="295" y="551" text-anchor="middle">answer prompt</text>
  <text class="small" x="295" y="571" text-anchor="middle">context + citation rules</text>

  <rect class="box boxBlue" x="470" y="525" width="170" height="70" />
  <text class="text" x="555" y="551" text-anchor="middle">stream/final</text>
  <text class="small" x="555" y="571" text-anchor="middle">answer + sources</text>

