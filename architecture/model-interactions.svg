  <text class="small" x="147" y="810" text-anchor="middle">gallery route</text>

  <path class="db" d="M265 765 h135 a16 16 0 0 1 16 16 v30 a16 16 0 0 1 -16 16 h-135 a16 16 0 0 1 -16 -16 v-30 a16 16 0 0 1 16 -16 z" />
  <text class="text" x="332" y="790" text-anchor="middle">assets queue</text>
  <text class="small" x="332" y="810" text-anchor="middle">uploaded/scanning</text>

  <rect class="box boxBlue" x="465" y="765" width="145" height="62" />
  <text class="text" x="537" y="790" text-anchor="middle">scan_worker</text>
  <text class="small" x="537" y="810" text-anchor="middle">background thread</text>

  <rect class="box boxOrange" x="660" y="765" width="165" height="62" />
  <text class="text" x="742" y="790" text-anchor="middle">normalize</text>
  <text class="small" x="742" y="810" text-anchor="middle">TXT / PDF / DOCX</text>

  <rect class="box boxRed" x="660" y="865" width="165" height="50" />
  <text class="text" x="742" y="886" text-anchor="middle">OCR fallback</text>
  <text class="tiny" x="742" y="904" text-anchor="middle">Tesseract for PDFs</text>

  <rect class="box boxPurple" x="875" y="865" width="185" height="50" />
  <text class="text" x="967" y="886" text-anchor="middle">LLM normalize</text>
  <text class="tiny" x="967" y="904" text-anchor="middle">optional labels only</text>

  <rect class="box boxOrange" x="875" y="765" width="150" height="62" />
  <text class="text" x="950" y="790" text-anchor="middle">chunker</text>
  <text class="small" x="950" y="810" text-anchor="middle">heading/page aware</text>

  <rect class="box boxGreen" x="1075" y="765" width="145" height="62" />
  <text class="text" x="1147" y="790" text-anchor="middle">bge-m3</text>
  <text class="small" x="1147" y="810" text-anchor="middle">embed chunks</text>

  <path class="db" d="M1275 765 h135 a16 16 0 0 1 16 16 v30 a16 16 0 0 1 -16 16 h-135 a16 16 0 0 1 -16 -16 v-30 a16 16 0 0 1 16 -16 z" />
  <text class="text" x="1342" y="790" text-anchor="middle">document_chunks</text>
  <text class="small" x="1342" y="810" text-anchor="middle">Postgres + pgvector</text>

  <path class="line" d="M215 796 H249" />
  <path class="line" d="M416 796 H465" />
  <path class="line" d="M610 796 H660" />
  <path class="line" d="M825 796 H875" />
  <path class="line" d="M1025 796 H1075" />
  <path class="line" d="M1220 796 H1259" />
  <path class="dashed" d="M742 827 V865" />
  <path class="dashed" d="M825 890 H875" />
  <path class="dashed" d="M967 865 V842 H742 V827" />
  <path class="line" d="M1342 765 V675 H610 V440" />

  <text class="tiny" x="80" y="970">Dashed arrows are optional/fallback flows. `llm_normalize` never writes generated text into the document; it only changes structural labels.</text>
</svg>
