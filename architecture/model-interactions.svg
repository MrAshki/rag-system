  <text class="text" x="790" y="551" text-anchor="middle">tool_runner</text>
  <text class="small" x="790" y="571" text-anchor="middle">summary / exam / generic</text>
  <path class="line" d="M1040 234 V610 H790 V595" />
  <path class="line" d="M790 525 V485 H382 V440" />
  <path class="line" d="M880 560 H1000" />

  <!-- Gateway -->
  <rect class="box boxPurple" x="1025" y="370" width="200" height="70" />
  <text class="text" x="1125" y="396" text-anchor="middle">model_gateway</text>
  <text class="small" x="1125" y="416" text-anchor="middle">get_chat_provider()</text>

  <rect class="box boxPurple" x="1270" y="370" width="145" height="70" />
  <text class="text" x="1342" y="396" text-anchor="middle">ChatProvider</text>
  <text class="small" x="1342" y="416" text-anchor="middle">chat / stream_chat</text>

  <rect class="box" x="1060" y="500" width="130" height="55" />
  <text class="text" x="1125" y="523" text-anchor="middle">Ollama</text>
  <text class="tiny" x="1125" y="542" text-anchor="middle">gemma3:12b</text>

  <rect class="box" x="1210" y="500" width="130" height="55" />
  <text class="text" x="1275" y="523" text-anchor="middle">Gemini</text>
  <text class="tiny" x="1275" y="542" text-anchor="middle">API key gated</text>

  <rect class="box" x="1360" y="500" width="80" height="55" />
  <text class="text" x="1400" y="523" text-anchor="middle">DeepSeek</text>
  <text class="tiny" x="1400" y="542" text-anchor="middle">API</text>

  <path class="line" d="M1225 405 H1270" />
  <path class="line" d="M1342 440 V470 H1125 V500" />
  <path class="line" d="M1342 440 V470 H1275 V500" />
  <path class="line" d="M1342 440 V470 H1400 V500" />
  <path class="line" d="M1195 352 V370" />
  <path class="line" d="M165 370 V330 H1025" />
  <path class="line" d="M295 525 V485 H1025" />

  <path class="db" d="M1145 600 h230 a18 18 0 0 1 18 18 v30 a18 18 0 0 1 -18 18 h-230 a18 18 0 0 1 -18 -18 v-30 a18 18 0 0 1 18 -18 z" />
  <text class="text" x="1260" y="625" text-anchor="middle">PostgreSQL</text>
  <text class="small" x="1260" y="644" text-anchor="middle">messages + generated_outputs</text>
  <path class="line" d="M855 234 V633 H1127" />
  <path class="line" d="M1185 555 V600" />
  <path class="line" d="M1275 555 V600" />
  <path class="line" d="M1400 555 V600" />

